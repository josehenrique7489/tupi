
<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Orçamento Enviado | Tupi Mudanças</title>

    <!-- Bootstrap 5.3 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            min-height: 100vh;

            margin: 0;

            font-family:
                "Segoe UI",
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #eaf3ff 0%,
                    #ffffff 50%,
                    #d9eaff 100%
                );

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 30px;

        }


        .pagina {

            width: 100%;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

        }


        .card-sucesso {

            width: 100%;

            max-width: 620px;

            padding: 50px 45px;

            text-align: center;

            background:
                rgba(255, 255, 255, 0.78);

            backdrop-filter: blur(14px);

            -webkit-backdrop-filter: blur(14px);

            border: 1px solid
                rgba(255, 255, 255, 0.9);

            border-radius: 28px;

            box-shadow:
                0 20px 60px
                rgba(13, 61, 145, 0.14);

            position: relative;

            overflow: hidden;

        }


        /* detalhe superior */

        .card-sucesso::before {

            content: "";

            position: absolute;

            top: 0;

            left: 0;

            width: 100%;

            height: 5px;

            background:
                linear-gradient(
                    90deg,
                    #0b3d91,
                    #0d6efd,
                    #4da3ff
                );

        }


        /* Ícone */

        .icone-sucesso {

            width: 92px;

            height: 92px;

            margin: 0 auto 28px;

            border-radius: 50%;

            display: flex;

            align-items: center;

            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    #0b3d91,
                    #0d6efd
                );

            color: white;

            font-size: 46px;

            box-shadow:
                0 12px 28px
                rgba(13, 110, 253, 0.25);

        }


        .icone-sucesso i {

            animation:
                aparecer 0.6s ease;

        }


        @keyframes aparecer {

            from {

                opacity: 0;

                transform: scale(0.5);

            }

            to {

                opacity: 1;

                transform: scale(1);

            }

        }


        /* Título */

        h1 {

            color: #0b3d91;

            font-size: 34px;

            font-weight: 800;

            letter-spacing: -0.5px;

            margin-bottom: 16px;

        }


        /* Texto */

        .texto {

            color: #52657a;

            font-size: 17px;

            line-height: 1.7;

            margin-bottom: 28px;

        }


        .texto strong {

            color: #0b3d91;

        }


        /* Caixa de informação */

        .mensagem {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 5px;

            background:
                rgba(234, 243, 255, 0.85);

            border: 1px solid
                rgba(13, 110, 253, 0.10);

            border-radius: 14px;

            padding: 17px 20px;

            color: #24476b;

            font-size: 15px;

            margin-bottom: 30px;

        }


        .mensagem i {

            color: #0d6efd;

            font-size: 19px;

        }


        /* Botão */

        .btn-voltar {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 4px;

            min-width: 210px;

            padding: 14px 28px;

            border-radius: 12px;

            background:
                linear-gradient(
                    135deg,
                    #0b3d91,
                    #0d6efd
                );

            color: #ffffff;

            text-decoration: none;

            font-size: 16px;

            font-weight: 700;

            border: none;

            box-shadow:
                0 8px 20px
                rgba(13, 110, 253, 0.20);

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease,
                filter 0.25s ease;

        }


        .btn-voltar:hover {

            color: #ffffff;

            transform: translateY(-3px);

            filter: brightness(1.05);

            box-shadow:
                0 14px 28px
                rgba(13, 110, 253, 0.30);

        }


        .btn-voltar:active {

            transform: translateY(-1px);

        }


        /* Rodapé */

        .rodape {

            margin-top: 25px;

            color: #8493a5;

            font-size: 13px;

        }


        /* Responsivo */

        @media (max-width: 576px) {

            body {

                padding: 15px;

            }


            .pagina {

                min-height: auto;

            }


            .card-sucesso {

                padding: 42px 22px;

                border-radius: 22px;

            }


            .icone-sucesso {

                width: 78px;

                height: 78px;

                font-size: 38px;

                margin-bottom: 22px;

            }


            h1 {

                font-size: 28px;

            }


            .texto {

                font-size: 15px;

            }


            .mensagem {

                font-size: 14px;

                padding: 15px;

            }


            .btn-voltar {

                width: 100%;

            }

        }

    </style>

</head>


<body>

    <div class="pagina">

        <div class="card-sucesso">

            <!-- Ícone de sucesso -->

            <div class="icone-sucesso">

                <i class="bi bi-check-lg"></i>

            </div>


            <!-- Título -->

            <h1>

                Orçamento enviado!

            </h1>


            <!-- Texto -->

            <p class="texto">

                Recebemos suas informações

                <strong>com sucesso.</strong>

                <br>

                Nossa equipe da

                <strong>Tupi Mudanças</strong>

                entrará em contato com você em breve.

            </p>


            <!-- Mensagem -->

            <div class="mensagem">

                <i class="bi bi-info-circle-fill"></i>

                <span>

                    Obrigado por escolher a

                    <strong>Tupi Mudanças</strong>!

                </span>

            </div>


            <!-- Botão -->

            <a
                href="../index.html"
                class="btn-voltar">

                <i class="bi bi-house-fill"></i>

                Voltar para o início

            </a>


            <!-- Rodapé -->

            <div class="rodape">

                Tupi Mudanças • 2026

            </div>

        </div>

    </div>


    <!-- Bootstrap JS -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
